[project]
name = "qual-score-llm"
version = "0.1.0"
description = "LLM judge for QuAL feedback scores (Evidence, Suggestion, Connection)."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "deepeval==3.8.6",
    "openai>=1.0.0",
    "python-dotenv>=1.0.0",
    "pyyaml>=6.0",
    "pandas>=2.0.0",
    "numpy>=1.24.0",
    "scikit-learn>=1.3.0",
    "matplotlib>=3.8.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["judges", "prompts", "evaluation"]
